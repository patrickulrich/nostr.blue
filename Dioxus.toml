[application]
name = "nostrblue"
default_platform = "web"
asset_dir = "public"
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"
android_min_sdk_version = 24

[bundle]
identifier = "com.nostr.blue"
publisher = "nostr.blue"
icon = ["public/icons/icon-512.png", "public/icons/icon-192.png"]
resources = ["public/**/*"]
short_description = "Decentralized social client for Nostr"

[android]
identifier = "com.nostr.blue"
icon = ["public/icons/icon-512.png", "public/icons/icon-192.png"]
min_sdk = 24
target_sdk = 35
compile_sdk = 35

[web.app]
title = "nostr.blue - Decentralized Social Network"
base_path = ""

[web.watcher]
watch_path = ["src", "public", "assets"]
reload_html = true
index_on_404 = true

[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []

# [[web.proxy]]
# backend = "http://localhost:8000/api"

[desktop.window]
title = "nostr.blue"
width = 1280
height = 800
resizable = true
