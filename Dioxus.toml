[application]
asset_dir = "public"
android_manifest = "android/AndroidManifest.xml"
android_main_activity = "android/MainActivity.kt"
android_min_sdk_version = 26

[bundle]
identifier = "com.nostr.blue"
publisher = "nostr.blue"
icon = ["public/icons/icon-512.png", "public/icons/icon-192.png"]
resources = ["public/**/*"]
short_description = "Decentralized social client for Nostr"

[android]
identifier = "com.nostr.blue"
icon = ["public/icons/icon-512.png", "public/icons/icon-192.png"]
min_sdk = 26
target_sdk = 36
compile_sdk = 36
gradle_dependencies = [
    "androidx.media3:media3-exoplayer:1.9.0",
    "androidx.media3:media3-exoplayer-hls:1.9.0",
    "androidx.media3:media3-session:1.9.0",
    "com.google.android.gms:play-services-auth:21.0.0",
    "androidx.credentials:credentials:1.3.0",
    "androidx.credentials:credentials-play-services-auth:1.3.0",
    "com.google.android.libraries.identity.googleid:googleid:1.1.0",
    "com.squareup.okhttp3:okhttp:4.12.0",
    "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0",
    "androidx.health.connect:connect-client:1.1.0",
]
lib_name = "dioxusmain"

[web.app]
title = "nostr.blue - Decentralized Social Network"
base_path = ""

[web.watcher]
watch_path = ["src", "public", "assets"]
reload_html = true
index_on_404 = true

[web.resource]
style = []
script = []

[web.resource.dev]
style = []
script = []

# [[web.proxy]]
# backend = "http://localhost:8000/api"
