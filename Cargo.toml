[package]
name = "nostrblue"
version = "0.8.7"
edition = "2021"
rust-version = "1.82"
authors = ["Patrick Ulrich"]
description = "A decentralized social network client built on the Nostr protocol using Rust and Dioxus"
license = "MIT"

[features]
default = ["web"]
cashu = ["dep:cdk", "dep:cdk-common", "nostr/nip60"]
mobile_platform = []
playstore = ["dioxus/mobile", "native", "dep:jni", "dep:ndk-context", "mobile_platform"]
web = [
    "dioxus/web",
    "dioxus-motion/web",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys",
    "dep:web-sys", "dep:indexed_db_futures",
    "dep:gloo-storage", "dep:gloo-timers", "dep:gloo-events", "dep:gloo-net",
    "dep:nostr-indexeddb", "dep:nostr-browser-signer",
    "dep:serde-wasm-bindgen", "dep:wasm-logger", "dep:console_error_panic_hook",
    "chrono/wasmbind", "uuid/js", "getrandom/js", "instant/wasm-bindgen",
    "cashu",
]
desktop = ["dioxus/desktop", "dioxus-motion/desktop", "native", "dep:arboard", "dep:rfd", "dep:webbrowser", "cashu"]
mobile = ["dioxus/mobile", "dioxus-motion/desktop", "native", "dep:jni", "dep:ndk-context", "cashu", "mobile_platform"]
native = [
    "dep:nostr-ndb", "dep:nostrdb", "dep:cdk-sqlite", "dep:git2",
    "dep:dirs", "dep:env_logger", "dep:rusqlite",
    "tokio/rt-multi-thread", "tokio/fs", "getrandom/std",
]

[dependencies]
# Dioxus web framework
dioxus = { version = "0.7.5", default-features = false, features = ["router", "launch", "logger", "lib"] }
dioxus-stores = "0.7.4"
dioxus-motion = { version = "0.3.5", default-features = false, optional = true }

# Nostr protocol
nostr = { version = "0.44.1", default-features = false, features = ["std", "nip47", "nip49", "nip57", "nip98"] }
nostr-sdk = { version = "0.44.1", default-features = false, features = ["nip44", "nip59", "nip57"] }
nostr-database = { version = "0.44.0", default-features = false }
nostr-indexeddb = { version = "0.44.0", optional = true }
nostr-browser-signer = { version = "0.44.1", optional = true }
nostr-blossom = { version = "0.44.0" }
nostr-connect = { version = "0.44.0" }
nostr-gossip-memory = { version = "0.44.0" }
nostr-relay-pool = { version = "0.44.0" }
nwc = { version = "0.44.0" }
nostr-ndb = { version = "0.44.0", optional = true }
nostrdb = { version = "0.8.0", optional = true }

# Cashu ecash protocol (optional, gated by "cashu" feature)
cdk = { version = "0.14.2", default-features = false, features = ["wallet", "auth"], optional = true }
cdk-common = { version = "0.14.2", default-features = false, features = ["wallet", "auth"], optional = true }
cdk-sqlite = { version = "0.14.2", default-features = false, features = ["wallet"], optional = true }

# Image processing for Blossom uploads
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["sync", "macros", "time"], default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = { version = "0.6", optional = true }

# Browser APIs and storage (web only)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
indexed_db_futures = { version = "0.5", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Storage",
    "MediaQueryList",
    "Navigator",
    "Clipboard",
    "DomRect",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    # File upload features for Blossom integration
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "FileReader",
    "Event",
    "EventTarget",
    # BeforeUnload for unsaved changes warning
    "BeforeUnloadEvent",
    # KeyboardEvent for document-level key listeners
    "KeyboardEvent",
    # MediaRecorder API for voice messages
    "MediaStream",
    "MediaRecorder",
    "MediaDevices",
    "MediaStreamConstraints",
    "BlobEvent",
    # Intersection Observer for infinite scroll
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    # Virtual scrolling
    "ScrollBehavior",
    "HtmlDivElement",
    # IndexedDB for keyset counter persistence
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    # NIP-96 file upload features
    "FormData",
    "BlobPropertyBag",
    # Object URL for efficient blob previews (avoids base64 memory overhead)
    "Url",
    # AbortController for cancellable HTTP requests
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
] }
gloo-storage = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
gloo-events = { version = "0.2.0", optional = true }
gloo-net = { version = "0.6", optional = true }

# Logging
log = "0.4"
wasm-logger = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
env_logger = { version = "0.11", optional = true }

# Utilities
chrono = "0.4"
chrono-tz = "0.10"
regex = "1.10"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bech32 = "0.11"
qrcode = "0.14"
base64 = "0.22"
hex = "0.4"
lru = "0.16"
instant = "0.1"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = "0.2"
once_cell = "1.19"
thiserror = "2.0"
emoji = "0.2"

# Native-only utilities
dirs = { version = "6.0.0", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
git2 = { version = "0.19", optional = true }
arboard = { version = "3.4", optional = true }
rfd = { version = "0.15", optional = true }
webbrowser = { version = "1.0", optional = true }

# Android-only (NIP-55 signer via JNI)
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

# Markdown rendering
pulldown-cmark = "0.13"
ammonia = "4.0"
maplit = "1.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# RSS feed parsing and podcast support
quick-xml = "0.39"
strum = { version = "0.27.2", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
