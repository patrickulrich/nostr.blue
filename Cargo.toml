[package]
name = "nostrblue"
version = "0.7.11"
edition = "2021"
rust-version = "1.82"
authors = ["Patrick Ulrich"]
description = "A decentralized social network client built on the Nostr protocol using Rust and Dioxus"
license = "MIT"

[dependencies]
# Dioxus web framework
dioxus = { version = "0.7.3", default-features = false, features = ["web", "router", "launch", "logger", "lib"] }
dioxus-stores = "0.7.3"

# Nostr protocol
nostr = { version = "0.44.1", default-features = false, features = ["std", "nip47", "nip49", "nip57", "nip60", "nip98"] }
nostr-sdk = { version = "0.44.1", default-features = false, features = ["nip44", "nip59", "nip57"] }
nostr-database = { version = "0.44.0", default-features = false }
nostr-indexeddb = { version = "0.44.0" }
nostr-browser-signer = { version = "0.44.1" }
nostr-blossom = { version = "0.44.0" }
nostr-connect = { version = "0.44.0" }
nostr-gossip-memory = { version = "0.44.0" }
nostr-relay-pool = { version = "0.44.0" }
nwc = { version = "0.44.0" }

# Cashu ecash protocol
cdk = { version = "0.14.2", default-features = false, features = ["wallet", "auth"] }
cdk-common = { version = "0.14.2", default-features = false, features = ["wallet", "auth"] }

# Image processing for Blossom uploads
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"

# Async runtime for WASM
tokio = { version = "1", features = ["sync", "macros", "time"], default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Browser APIs and storage
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
indexed_db_futures = "0.5"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Storage",
    "MediaQueryList",
    "Navigator",
    "Clipboard",
    "DomRect",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    # File upload features for Blossom integration
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "FileReader",
    "Event",
    "EventTarget",
    # BeforeUnload for unsaved changes warning
    "BeforeUnloadEvent",
    # MediaRecorder API for voice messages
    "MediaStream",
    "MediaRecorder",
    "MediaDevices",
    "MediaStreamConstraints",
    "BlobEvent",
    # Intersection Observer for infinite scroll
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    # Virtual scrolling
    "ScrollBehavior",
    "HtmlDivElement",
    # IndexedDB for keyset counter persistence
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    # NIP-96 file upload features
    "FormData",
    "BlobPropertyBag",
    # Object URL for efficient blob previews (avoids base64 memory overhead)
    "Url",
    # AbortController for cancellable HTTP requests
    "AbortController",
    "AbortSignal",
] }
gloo-storage = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

# Logging
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"

# Utilities
chrono = { version = "0.4", features = ["wasmbind"] }
regex = "1.10"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4", "js"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
gloo-net = "0.6"
bech32 = "0.11"
qrcode = "0.14"
base64 = "0.22"
hex = "0.4"
lru = "0.16"
instant = { version = "0.1", features = ["wasm-bindgen"] }
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
once_cell = "1.19"
thiserror = "2.0"
emoji = "0.2"

# Markdown rendering
pulldown-cmark = "0.13"
ammonia = "4.0"
maplit = "1.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# RSS feed parsing and podcast support
quick-xml = "0.39"
strum = { version = "0.27.2", features = ["derive"] }
gloo-events = "0.2.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
