[package]
name = "nostrblue"
version = "0.8.24"
edition = "2021"
rust-version = "1.95"
authors = ["Patrick Ulrich"]
description = "A decentralized social network client built on the Nostr protocol using Rust and Dioxus"
license = "MIT"

[features]
default = ["web"]
cashu = ["dep:cdk", "dep:cdk-common", "nostr/nip60"]
cashu_native = ["cashu", "dep:cdk-redb"]
mobile_platform = []
playstore = ["dioxus/mobile", "dioxus-motion/desktop", "native", "dep:jni", "dep:ndk-context", "mobile_platform"]
web = [
    "dioxus/web",
    "dioxus-motion/web",
    "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys",
    "dep:web-sys", "dep:indexed_db_futures",
    "dep:gloo-storage", "dep:gloo-timers", "dep:gloo-events", "dep:gloo-net",
    "dep:nostr-sqlite", "dep:sqlite-wasm-rs", "dep:sqlite-wasm-vfs",
    "dep:nostr-gossip-sqlite",
    "dep:nostr-browser-signer",
    "dep:universal-time",
    "dep:serde-wasm-bindgen", "dep:console_error_panic_hook",
    "chrono/wasmbind", "uuid/js", "getrandom/js", "instant/wasm-bindgen",
    "dep:getrandom_04",
    "cashu",
]
desktop = ["dioxus/desktop", "dioxus-motion/desktop", "native", "dep:arboard", "dep:rfd", "dep:webbrowser", "dep:notify-rust", "cashu_native", "dep:moq-lite", "dep:web-transport-quinn", "dep:cpal", "dep:opus"]
mobile = ["dioxus/mobile", "dioxus-motion/desktop", "native", "dep:jni", "dep:ndk-context", "mobile_platform"]
native = [
    "dep:nostr-ndb", "dep:nostrdb", "dep:git2",
    "dep:nostr-gossip-sqlite", "nostr-gossip-sqlite/bundled",
    "dep:dirs", "dep:env_logger", "dep:rusqlite",
    "tokio/rt-multi-thread", "tokio/fs", "getrandom/std",
    "dep:rustls",
]

[dev-dependencies]
# MockRelay/LocalRelay for integration tests (quorum-EOSE, ReqTarget routing,
# send/ack paths). Unifies with the normal nostr-sdk dep for tests.
nostr-sdk = { version = "0.45.4", features = ["local-relay"] }
# cdk-redb 0.17 leaked `cdk-common/test` through a regular dependency (which
# is how the wallet-database conformance harness used to resolve); 0.18 moved
# it to cdk-redb's dev-deps, so enable it ourselves for test builds.
cdk-common = { version = "=0.18.3", default-features = false, features = ["wallet", "test"] }

[dependencies]
zeroize = "1.8"

# Chess engine
rschess = { version = "2.0.5", features = ["pgn"] }

# Dioxus web framework
# NOTE: do NOT enable dioxus's "logger" feature here. `dioxus::launch` would
# auto-install `dioxus-logger` as the global tracing subscriber (tracing-wasm
# on web), which sets `dispatcher::has_been_set()` and permanently disables
# tracing's log bridge — every nostr-sdk `tracing::` diagnostic would then
# bypass the `log` facade (and `platform::logging`'s demotion table) and
# print unfiltered to the console. Verified against dioxus-0.7.9 launch.rs:299
# and tracing-0.1.44 macros.rs `if_log_enabled!`.
# (dioxus-primitives re-enables the feature transitively via its own default
# features, which is why platform::logging also pre-installs a forwarding
# subscriber before launch — see init_tracing_bridge.)
dioxus = { version = "=0.7.9", default-features = false, features = ["router", "launch", "lib"] }
# tracing → `log` facade forwarding (src/platform/logging.rs). The dioxus
# "logger" feature is re-enabled transitively by dioxus-primitives' default
# features; installing our own subscriber before `dioxus::launch` makes
# dioxus-logger's auto-init a no-op and keeps SDK diagnostics flowing through
# the filtered log facade. Both crates are MIT and already in the graph.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
dioxus-stores = "=0.7.9"
dioxus-motion = { version = "0.3.5", default-features = false, optional = true }

# Nostr protocol
nostr = { version = "0.45.5", default-features = false, features = ["std", "nip04", "nip06", "nip44", "nip59", "nip47", "nip49", "nip98", "os-rng"] }
# 0.45: no nip* cargo features anymore (all-TLS features only); defaults = ring +
# rustls-tls-webpki-roots, matching the repo-wide ring-only TLS policy (#381).
nostr-sdk = "0.45.4"

# Mostro P2P exchange protocol (matches mostro-core 0.14.6 / mostrod 0.19.x)
# 0.14.3+ migrated to nostr-sdk 0.45; 0.14.5 fixes the rumor-id-inside-giftwrap
# serialization (chat interop), 0.14.6 adds CantDoReason::MaintenanceMode +
# Unknown catch-all.
mostro-core = { version = "0.14.6", default-features = true }
nostr-database = { version = "0.45.2", default-features = false }
# Web event store: nostr-sqlite over sqlite-wasm (OPFS SAHPool -> relaxed-IDB
# VFS fallback, registered at runtime; symbols for libsqlite3-sys are provided
# by sqlite-wasm-rs at the final wasm link).
nostr-sqlite = { version = "0.45.2", default-features = false, optional = true }
# sqlite-wasm-rs compiles SQLite's C sources against a WASM shim — it cannot
# build for native/host targets (host `cargo test` with the web feature).
# Gate to wasm32 so host test builds skip it entirely.
nostr-browser-signer = { version = "0.45.1", optional = true }
# nostr/nostr-sdk 0.45 use universal-time for Instant/SystemTime. On
# wasm32-unknown-unknown the crate dispatches through a global
# `&'static dyn TimeProvider` that the *binary* crate must define via
# `define_time_provider!` (see src/main.rs). Without it the zeroed fat
# pointer traps with "RuntimeError: null function" on the first
# Instant::now()/SystemTime::now() — e.g. during boot's try_connect().
# MIT licensed. Feature-unified with nostr's universal-time/std edge.
universal-time = { version = "0.3", default-features = false, optional = true }
nostr-blossom = "0.45.1"
num-bigint = "0.4"
nostr-connect = "0.45.2"
nostr-gossip-memory = "0.45.1"
# In-memory NostrDatabase (SDK fallback for non-wasm/non-native builds, host tests)
nostr-memory = "0.45.2"
# Persistent gossip store (survives sessions). Bundled sqlite on native only;
# wasm build links against sqlite-wasm-rs symbols like nostr-sqlite.
nostr-gossip-sqlite = { version = "0.45.1", default-features = false, optional = true }
nwc = "0.45.1"
nostr-ndb = { version = "0.45.2", optional = true }
nostrdb = { version = "0.9.0", optional = true }

# Cashu ecash protocol (optional, gated by "cashu" feature)
# NOTE: cdk-sqlite (all cdk releases) pins rusqlite ^0.31 which conflicts with
# nostr-sqlite's rusqlite 0.38 via the `links = "sqlite3"` uniqueness rule.
# Desktop therefore uses cdk-redb (pure Rust, no links conflict). Wallet state
# recovery across the backend switch is provided by NIP-60 nostr events, the
# designed source of truth for the cashu store.
# FLOOR 0.18.3, pinned EXACTLY (`=`): do not float to a newer 0.18.x without
# re-auditing — main (post-0.18.3) has already removed the shared wallet trait
# and wallet/websocket.rs. 0.18.3 changes vs 0.17.7: WalletDatabase gains
# `increment_derivation_counter` (IndexedDB schema v9), redb migrates 5->6 on
# open (guarded by a one-time .v5.bak copy in internal.rs), and the wallet
# getters are renamed (`get_active_keyset` -> `active_keyset`,
# `get_mint_keysets` -> `keysets`). bitcoin 0.32.2 / lightning-invoice 0.34.0 /
# rustls 0.23.27 stay put; cdk's reqwest moves 0.12 -> 0.13 (coexists with
# ours on native builds — compile-time cost only). nostr-sdk stays 0.44.1
# inside cdk and is NOT enabled (we use default-features = false, "wallet").
cdk = { version = "=0.18.3", default-features = false, features = ["wallet"], optional = true }
cdk-common = { version = "=0.18.3", default-features = false, features = ["wallet"], optional = true }
cdk-redb = { version = "=0.18.3", optional = true }

# Image processing for Blossom uploads
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
bitcoin = "0.32"
bitcoin_hashes = "0.14"
# SHA-256 hash type for Blossom blob addressing (BUD-01/10). 1.x is the
# major nostr-blossom/nostr 0.45 use; the 0.14 pin above stays for bitcoin
# 0.32 interop. Same crate, renamed to disambiguate. MIT.
bitcoin_hashes_1 = { package = "bitcoin_hashes", version = "1.1", default-features = false }
# Vendored NIP-57 private-zap crypto (dip03) — same versions nostr 0.45 uses
secp256k1 = "0.30"
aes = "0.8"
cbc = "0.1"
lightning-invoice = { version = "0.34.0", default-features = false }
bip39 = "2.2"

# Async runtime
tokio = { version = "1", features = ["sync", "macros", "time"], default-features = false }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["async-await"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = { version = "0.6", optional = true }

# Browser APIs and storage (web only)
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
indexed_db_futures = { version = "0.5", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlAudioElement",
    "HtmlVideoElement",
    "Storage",
    "MediaQueryList",
    "Navigator",
    "Performance",
    "Clipboard",
    "DomRect",
    "console",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    # File upload features for Blossom integration
    "HtmlInputElement",
    "FileList",
    "File",
    "Blob",
    "FileReader",
    "Event",
    "EventTarget",
    # BeforeUnload for unsaved changes warning
    "BeforeUnloadEvent",
    # KeyboardEvent for document-level key listeners
    "KeyboardEvent",
    # MediaRecorder API for voice messages
    "MediaStream",
    "MediaRecorder",
    "MediaDevices",
    "MediaStreamConstraints",
    "BlobEvent",
    # Intersection Observer for infinite scroll
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    # Virtual scrolling
    "ScrollBehavior",
    "HtmlDivElement",
    # IndexedDB for keyset counter persistence
    "IdbFactory",
    "IdbDatabase",
    "IdbOpenDbRequest",
    "IdbObjectStore",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "IdbCursorWithValue",
    "IdbKeyRange",
    # NIP-96 file upload features
    "FormData",
    "BlobPropertyBag",
    # Object URL for efficient blob previews (avoids base64 memory overhead)
    "Url",
    # AbortController for cancellable HTTP requests
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Location",
] }
gloo-storage = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
gloo-events = { version = "0.2.0", optional = true }
gloo-net = { version = "0.6", optional = true }

# Logging
log = { version = "0.4", features = ["std"] }
console_error_panic_hook = { version = "0.1", optional = true }
env_logger = { version = "0.11", optional = true }

# Utilities
chrono = "0.4"
chrono-tz = "0.10"
regex = "1.10"
urlencoding = "2.1"
uuid = { version = "1.0", features = ["v4"] }
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bech32 = "0.12"
qrcode = "0.14"
rqrr = "0.7"
base64 = "0.22"
# CBOR codec for NUT-24 `creqA` / `cashuB` payment payloads (BUD-07 X-Cashu).
# Apache-2.0 (verified in registry LICENSE); already in the graph via cdk.
ciborium = "0.2"
hex = "0.4"
lru = "0.16"
instant = "0.1"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = "0.2"
# nostr 0.45 -> rand 0.10 pulls a second getrandom instance (0.4); on wasm it
# needs the renamed `wasm_js` feature (our 0.2 pin uses the old `js` name).
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }
once_cell = "1.19"
thiserror = "2.0"
emojis = "0.9"

# Native-only utilities
dirs = { version = "6.0.0", optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
git2 = { version = "0.19", optional = true }
arboard = { version = "3.4", optional = true }
rfd = { version = "0.15", optional = true }
webbrowser = { version = "1.0", optional = true }

# Desktop-only (Linux/macOS/Windows native notifications via libnotify/DBus).
notify-rust = { version = "4", optional = true }

# Android-only (NIP-55 signer via JNI)
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

# Desktop-only native audio for Nests
moq-lite = { version = "0.16", optional = true }
# Ring-only TLS provider: default features pull aws-lc-rs which, unified with
# the ring features used everywhere else (reqwest, cdk, tokio-rustls), leaves
# rustls with two CryptoProviders and panics at first TLS use (issue #381).
web-transport-quinn = { version = "0.11", default-features = false, features = ["ring"], optional = true }
cpal = { version = "0.15", optional = true }
opus = { version = "0.3", optional = true }

# Native-only: install the ring CryptoProvider explicitly at startup so a
# future dependency can't silently reintroduce provider ambiguity (#381).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# Markdown rendering
pulldown-cmark = "0.13"
ammonia = "4.0"
maplit = "1.0"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# RSS feed parsing and podcast support
quick-xml = "0.39"
strum = { version = "0.27.2", features = ["derive"] }
geohash = "0.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# sqlite-wasm-rs compiles SQLite's C sources against a WASM shim — it cannot
# build for native/host targets (breaks host `cargo test` with the web
# feature). Keep it (and the VFS layer) wasm-only.
sqlite-wasm-rs = { version = "0.5", optional = true }
sqlite-wasm-vfs = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Vendored crates (see vendor/*/Cargo.toml for the reason each is patched).
[patch.crates-io]
ndk-context = { path = "vendor/ndk-context" }
nostr-blossom = { path = "vendor/nostr-blossom" }

[profile.dev]
opt-level = 0

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = false

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
