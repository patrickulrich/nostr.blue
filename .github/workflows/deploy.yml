name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "release-main"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.7
  NODE_VERSION: '24'
  RELEASE_NOTES: "Automated release from main."

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  web-build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-web-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-web-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked --force

      - name: Build with Dioxus
        run: dx build --release

      - name: Mirror index.html to 404.html for SPA routing
        run: cp ./target/dx/nostrblue/release/web/public/index.html ./target/dx/nostrblue/release/web/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/dx/nostrblue/release/web/public

  linux-build:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-linux-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          if apt-cache show libfuse2t64 >/dev/null 2>&1; then
            FUSE_PKG=libfuse2t64
          else
            FUSE_PKG=libfuse2
          fi
          sudo apt-get install -y \
            unzip \
            file \
            patchelf \
            squashfs-tools \
            desktop-file-utils \
            cmake \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            "$FUSE_PKG"

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked --force

      - name: Build AppImage bundle
        id: build_appimage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: dx bundle --platform desktop --package-types appimage --out-dir dist/linux-release --release --no-default-features --features desktop

      - name: Inspect linuxdeploy cache after bundle
        if: always()
        run: |
          ls -l ~/.cache/tauri || true
          file ~/.cache/tauri/linuxdeploy-x86_64.AppImage || true
          ls -l ~/.cache/tauri/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gstreamer.sh || true
          head -n 5 ~/.cache/tauri/linuxdeploy-plugin-gtk.sh || true
          APPIMAGE_EXTRACT_AND_RUN=1 ~/.cache/tauri/linuxdeploy-x86_64.AppImage --list-plugins || true
          APPDIR="$(find target/dx -type d -name '*.AppDir' | head -n1)"
          echo "APPDIR=$APPDIR"
          if [ -n "$APPDIR" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
              --verbosity 1 \
              --appdir "$APPDIR" \
              --plugin gtk \
              --output appimage || true
          fi

      - name: Fail if AppImage bundle failed
        if: steps.build_appimage.outcome != 'success'
        run: exit 1

      - name: Stage release asset
        run: |
          APPIMAGE="$(find dist/linux-release -maxdepth 1 -type f -name '*.AppImage' | head -n1)"
          if [ -z "$APPIMAGE" ]; then
            echo "Failed to find AppImage output" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$APPIMAGE" release-assets/nostrblue-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: release-assets/nostrblue-linux-x86_64.AppImage

  android-build:
    name: Build Android Artifacts
    runs-on: ubuntu-latest
    needs: metadata
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-release-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-android-cargo-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked --force

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for release builds" >&2
            exit 1
          fi
          mkdir -p .ci-secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-secrets/android-release.jks

      - name: Build Android release APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
          ANDROID_BUILD_MODE: release
          ANDROID_KEYSTORE_FILE: .ci-secrets/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ./scripts/build-android.sh

      - name: Verify APK metadata
        run: |
          APK=nostrblue-release.apk
          VERSION="${{ needs.metadata.outputs.version }}"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-metadata.txt
          grep -q "package: name='com.nostr.blue'" apk-metadata.txt
          grep -q "versionName='$VERSION'" apk-metadata.txt
          grep -q "application-label:'nostr.blue'" apk-metadata.txt

      - name: Build Play Store AAB
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
          ANDROID_BUILD_MODE: release
          ANDROID_KEYSTORE_FILE: .ci-secrets/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ./scripts/google-play.sh

      - name: Verify AAB artifact
        run: |
          AAB=nostrblue-android-play-store-release.aab
          test -f "$AAB"
          unzip -l "$AAB" > aab-contents.txt
          grep -q "BundleConfig.pb" aab-contents.txt
          grep -q "base/manifest/AndroidManifest.xml" aab-contents.txt

      - name: Validate AAB with bundletool when available
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
        run: |
          BUNDLETOOL="$(find "$GRADLE_USER_HOME" "$HOME/.gradle" "$HOME/.cache" -type f \( -name 'bundletool-all*.jar' -o -name 'bundletool*.jar' \) 2>/dev/null | head -n1)"
          if [ -n "$BUNDLETOOL" ]; then
            if unzip -p "$BUNDLETOOL" META-INF/MANIFEST.MF 2>/dev/null | grep -q '^Main-Class:'; then
              java -jar "$BUNDLETOOL" validate --bundle=nostrblue-android-play-store-release.aab
            else
              echo "bundletool cache artifact is not executable; skipping explicit validation"
            fi
          else
            echo "bundletool not found in cache; skipping explicit validation"
          fi

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp nostrblue-release.apk release-assets/nostrblue-android-arm64-release.apk
          cp nostrblue-android-play-store-release.aab release-assets/nostrblue-android-play-store-release.aab

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            release-assets/nostrblue-android-arm64-release.apk
            release-assets/nostrblue-android-play-store-release.aab

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, web-build, linux-build, android-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Normalize release assets
        run: |
          mkdir -p release-upload
          cp release-assets/linux-release/nostrblue-linux-x86_64.AppImage release-upload/
          cp release-assets/android-release/nostrblue-android-arm64-release.apk release-upload/
          cp release-assets/android-release/nostrblue-android-play-store-release.aab release-upload/

      - name: Validate release tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG already exists at $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Existing tag $TAG already points to $GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Resolve release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          FILE="public/docs/changelogs/${VERSION}.md"
          if [ -f "$FILE" ]; then
            echo "Using changelog from $FILE"
            {
              echo 'RELEASE_NOTES<<EOF'
              cat "$FILE"
              echo ''
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving it unchanged."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES" --latest
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release assets
        if: steps.create_release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release upload "$TAG" release-upload/*

  deploy:
    name: Deploy Website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish-release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
