name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release-main"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.3
  NODE_VERSION: '20'
  RELEASE_NOTES: "Automated release from main."

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Failed to read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  web-build:
    name: Build Web
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-web-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-web-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version $DX_VERSION --locked --force

      - name: Build with Dioxus
        run: dx build --release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./target/dx/nostrblue/release/web/public

  linux-build:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-linux-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            file \
            patchelf \
            desktop-file-utils \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version $DX_VERSION --locked --force

      - name: Build AppImage bundle
        run: dx bundle --platform desktop --package-types appimage --out-dir dist/linux-release --release --no-default-features --features desktop

      - name: Stage release asset
        run: |
          APPIMAGE="$(find dist/linux-release -maxdepth 1 -type f -name '*.AppImage' | head -n1)"
          if [ -z "$APPIMAGE" ]; then
            echo "Failed to find AppImage output" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$APPIMAGE" release-assets/nostrblue-linux-x86_64.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-assets/nostrblue-linux-x86_64.AppImage

  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-release-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-android-cargo-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version $DX_VERSION --locked --force

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for release builds" >&2
            exit 1
          fi
          mkdir -p .ci-secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .ci-secrets/android-release.jks

      - name: Build Android release APK
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
          ANDROID_BUILD_MODE: release
          ANDROID_KEYSTORE_FILE: .ci-secrets/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ./scripts/build-android.sh

      - name: Verify APK metadata
        run: |
          APK=nostrblue-release.apk
          VERSION="${{ needs.metadata.outputs.version }}"
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-metadata.txt
          grep -q "package: name='com.nostr.blue'" apk-metadata.txt
          grep -q "versionName='$VERSION'" apk-metadata.txt
          grep -q "application-label:'nostr.blue'" apk-metadata.txt

      - name: Stage release asset
        run: |
          mkdir -p release-assets
          cp nostrblue-release.apk release-assets/nostrblue-android-arm64-release.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/nostrblue-android-arm64-release.apk

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, web-build, linux-build, android-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Normalize release assets
        run: |
          mkdir -p release-upload
          cp release-assets/linux-release/nostrblue-linux-x86_64.AppImage release-upload/
          cp release-assets/android-release/nostrblue-android-arm64-release.apk release-upload/

      - name: Update release tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
          fi
          git push origin "refs/tags/$TAG" --force

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES" --latest
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release upload "$TAG" release-upload/* --clobber

  deploy:
    name: Deploy Website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
