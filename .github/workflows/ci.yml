name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Cargo check
        run: cargo check --target wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  wasm-conformance:
    name: Wasm IndexedDB Conformance
    runs-on: ubuntu-latest
    env:
      # Browser mode is required: the suite exercises IndexedDB, which only
      # exists in a real browser context (the runner's default Node.js
      # environment has no `window`). Headless is the runner's default.
      WASM_BINDGEN_USE_BROWSER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-wasm-tests-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-tests-cargo-

      # Prebuilt binary (matching the wasm-bindgen version in Cargo.lock) —
      # cargo install takes several minutes longer.
      - name: Install wasm-bindgen-cli
        run: |
          curl -sL https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen-test-runner /usr/local/bin/
          sudo mv wasm-bindgen-0.2.128-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/

      - name: Put chromedriver on PATH
        run: echo "$CHROMEWEBDRIVER" >> $GITHUB_PATH

      - name: Wasm IndexedDB conformance suite
        run: cargo test --target wasm32-unknown-unknown

  native-checks:
    name: Native Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pkg-config \
            cmake \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked --force

      - name: Dioxus check
        run: dx check --platform linux --no-default-features --features desktop

      - name: Cargo check
        run: cargo check --no-default-features --features desktop

      # --all-targets lints the #[cfg(test)] code too. The wasm clippy
      # steps below (and in the wasm job) intentionally stay WITHOUT
      # --all-targets: dependency test-targets (mio/notify family) do not
      # compile for wasm32 — 0 of those errors are in our source.
      - name: Clippy host
        run: cargo clippy --no-default-features --features desktop --all-targets -- -D warnings

      - name: Clippy wasm
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

      - name: Cargo test
        run: cargo test --no-default-features --features desktop

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.9 --locked --force

      - name: Build Android APK
        run: |
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-home"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ./scripts/build-android.sh

      - name: Verify APK metadata
        run: |
          APK=nostrblue-debug.apk
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-metadata.txt
          grep -q "package: name='com.nostr.blue'" apk-metadata.txt
          grep -q "versionName='$VERSION'" apk-metadata.txt
          grep -q "application-label:'nostr.blue'" apk-metadata.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: nostrblue-debug-apk
          path: nostrblue-debug.apk
