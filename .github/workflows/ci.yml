name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Cargo check
        run: cargo check --target wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  native-checks:
    name: Native Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.3 --locked --force

      - name: Dioxus check
        run: dx check --platform linux --no-default-features --features desktop

      - name: Cargo check
        run: cargo check --no-default-features --features desktop

      - name: Clippy host
        run: cargo clippy --no-default-features --features desktop -- -D warnings

      - name: Clippy wasm
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

      - name: Cargo test
        run: cargo test --no-default-features --features desktop

  android-build:
    name: Android Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.3 --locked --force

      - name: Generate temporary Android release keystore
        run: |
          mkdir -p .ci-secrets
          keytool -genkeypair \
            -keystore .ci-secrets/android-release.jks \
            -storepass android \
            -keypass android \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=nostr.blue CI, O=nostr.blue, C=US"

      - name: Build Android release APK
        run: |
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-home"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          export ANDROID_BUILD_MODE=release
          export ANDROID_KEYSTORE_FILE=.ci-secrets/android-release.jks
          export ANDROID_KEYSTORE_PASSWORD=android
          export ANDROID_KEY_ALIAS=ci-release
          export ANDROID_KEY_PASSWORD=android
          ./scripts/build-android.sh

      - name: Verify release APK metadata
        run: |
          APK=nostrblue-release.apk
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-metadata.txt
          grep -q "package: name='com.nostr.blue'" apk-metadata.txt
          grep -q "versionName='$VERSION'" apk-metadata.txt
          grep -q "application-label:'nostr.blue'" apk-metadata.txt

      - name: Build Android release AAB
        run: |
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-home"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          export ANDROID_BUILD_MODE=release
          export ANDROID_KEYSTORE_FILE=.ci-secrets/android-release.jks
          export ANDROID_KEYSTORE_PASSWORD=android
          export ANDROID_KEY_ALIAS=ci-release
          export ANDROID_KEY_PASSWORD=android
          ./scripts/build-android-aab.sh

      - name: Verify release AAB artifact
        run: |
          AAB=nostrblue-release.aab
          test -f "$AAB"
          unzip -l "$AAB" > aab-contents.txt
          grep -q "BundleConfig.pb" aab-contents.txt
          grep -q "base/manifest/AndroidManifest.xml" aab-contents.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nostrblue-android-release-validation
          path: |
            nostrblue-release.apk
            nostrblue-release.aab
