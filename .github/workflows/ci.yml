name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate docs submodules
        run: |
          for dir in public/docs/nips public/docs/nuts public/docs/blossom public/docs/NKBIPs public/docs/market-spec; do
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Submodule $dir is empty or missing" >&2
              exit 1
            fi
          done
          echo "All docs submodules populated"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Cargo check
        run: cargo check --target wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  native-checks:
    name: Native Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate docs submodules
        run: |
          for dir in public/docs/nips public/docs/nuts public/docs/blossom public/docs/NKBIPs public/docs/market-spec; do
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Submodule $dir is empty or missing" >&2
              exit 1
            fi
          done
          echo "All docs submodules populated"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-native-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-native-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            libudev-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.7 --locked --force

      - name: Dioxus check
        run: dx check --platform linux --no-default-features --features desktop

      - name: Cargo check
        run: cargo check --no-default-features --features desktop

      - name: Clippy host
        run: cargo clippy --no-default-features --features desktop -- -D warnings

      - name: Clippy wasm
        run: cargo clippy --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

      - name: Cargo test
        run: cargo test --no-default-features --features desktop

  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Validate docs submodules
        run: |
          for dir in public/docs/nips public/docs/nuts public/docs/blossom public/docs/NKBIPs public/docs/market-spec; do
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "ERROR: Submodule $dir is empty or missing" >&2
              exit 1
            fi
          done
          echo "All docs submodules populated"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS and JS assets
        run: npm run build:all

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.7 --locked --force

      - name: Build Android APK
        run: |
          export GRADLE_USER_HOME="$GITHUB_WORKSPACE/.gradle-home"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          ./scripts/build-android.sh

      - name: Verify APK metadata
        run: |
          APK=nostrblue-debug.apk
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n1)"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > apk-metadata.txt
          grep -q "package: name='com.nostr.blue'" apk-metadata.txt
          grep -q "versionName='$VERSION'" apk-metadata.txt
          grep -q "application-label:'nostr.blue'" apk-metadata.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: nostrblue-debug-apk
          path: nostrblue-debug.apk
