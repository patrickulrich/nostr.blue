<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="description" content="Decentralized social network on the Nostr protocol">
    <title>nostr.blue - Decentralized Social Network</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="nostr.blue">
    <link rel="manifest" href="/manifest.json">
    <!-- Apple touch icon (iOS only supports PNG format) -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Preconnect to CDNs for faster dynamic loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://vjs.zencdn.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://vjs.zencdn.net">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Voice recorder manager for handling MediaRecorder API (deferred) -->
    <script src="/voice-recorder.js" defer></script>
    <!-- Google Drive backup for encrypted key storage (deferred) -->
    <script src="/google-drive.js" defer></script>
    <!-- HLS manager for radio stream playback (deferred) -->
    <script src="/hls-manager.js" defer></script>
    <!-- MoQ audio transport for live audio rooms (deferred) -->
    <script src="/moq-nest.js" defer></script>
    <style>
        /* Hide scrollbar but keep scrolling functionality */
        .hide-scrollbar {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Ensure app container is visible */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="main"></div>

    <!-- SPA Redirect Handler for GitHub Pages 404 -->
    <script src="/spa-redirect.js"></script>

    <!-- Service Worker Registration with Update Notification -->
    <script src="/sw-register.js" defer></script>
</body>
</html>
