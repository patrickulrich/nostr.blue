<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Decentralized social network on the Nostr protocol">
    <title>nostr.blue - Decentralized Social Network</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="nostr.blue">
    <link rel="manifest" href="/manifest.json">
    <!-- Apple touch icon (iOS only supports PNG format) -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Preconnect to CDNs for faster dynamic loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://vjs.zencdn.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://vjs.zencdn.net">

    <!-- Favicons -->
    <link data-trunk rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link data-trunk rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link data-trunk rel="css" href="public/tailwind.css">

    <!-- Voice recorder manager for handling MediaRecorder API (deferred) -->
    <script data-trunk src="public/voice-recorder.js" defer></script>
    <!-- HLS manager for radio stream playback (deferred) -->
    <script data-trunk src="public/hls-manager.js" defer></script>
    <!-- Git worker for isomorphic-git operations -->
    <link data-trunk rel="copy-file" href="public/git-worker.js">
    <!-- PWA files -->
    <link data-trunk rel="copy-file" href="public/sw.js">
    <link data-trunk rel="copy-file" href="public/manifest.json">
    <link data-trunk rel="copy-dir" href="public/icons">
    <!-- SPA 404 redirect for GitHub Pages -->
    <link data-trunk rel="copy-file" href="public/404.html">
    <!-- Custom domain for GitHub Pages -->
    <link data-trunk rel="copy-file" href="public/CNAME">
    <style>
        /* Hide scrollbar but keep scrolling functionality */
        .hide-scrollbar {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Ensure app container is visible */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #main {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="main"></div>

    <!-- SPA Redirect Handler for GitHub Pages 404 -->
    <script>
        (function() {
            const redirect = sessionStorage.getItem('spa-redirect');
            if (redirect) {
                sessionStorage.removeItem('spa-redirect');
                // Validate redirect is a safe same-origin path
                if (redirect !== '/' && redirect !== '/index.html' &&
                    typeof redirect === 'string' &&
                    redirect.length > 0 &&
                    redirect.startsWith('/') &&
                    !redirect.startsWith('//') &&
                    !redirect.startsWith('/\\') &&
                    !redirect.includes('://') &&
                    !/[\r\n\x00-\x1f]/.test(redirect)) {
                    history.replaceState(null, '', redirect);
                }
            }
        })();
    </script>

    <!-- Service Worker Registration with Update Notification -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker registered:', reg.scope);

                        // Check for updates periodically
                        setInterval(() => reg.update(), 60 * 60 * 1000); // Check every hour

                        // Listen for update found
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            if (newWorker) {
                                newWorker.addEventListener('statechange', () => {
                                    // New service worker installed and ready to activate
                                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                        console.log('[PWA] New version available');
                                        // Dispatch custom event for the app to handle
                                        window.dispatchEvent(new CustomEvent('sw-update-available'));
                                    }
                                });
                            }
                        });
                    })
                    .catch(err => console.error('[PWA] Service Worker registration failed:', err));

                // Auto-reload when new service worker takes control
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    console.log('[PWA] Controller changed, reloading for update...');
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
