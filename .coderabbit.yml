# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration for nostr.blue
# A Nostr protocol client built with Rust and Dioxus

# Global settings
language: "en-US"
early_access: false

tone_instructions: "Expert in Rust, Dioxus, Nostr SDK, CDK, and WASM. Provide thorough, technical feedback on correctness, security, and performance. Be direct and constructive."

reviews:
  profile: assertive

  request_changes_workflow: false

  high_level_summary: true

  poem: true

  review_status: true

  review_details: true

  commit_status: true

  collapse_walkthrough: false

  changed_files_summary: true

  sequence_diagrams: true

  estimate_code_review_effort: true

  assess_linked_issues: true

  related_issues: true

  related_prs: true

  suggested_labels: true

  suggested_reviewers: true

  enable_prompt_for_ai_agents: true

  abort_on_close: true

  labeling_instructions:
    - label: "rust"
      instructions: "Apply when the PR contains changes to Rust source files (.rs)"
    - label: "wasm"
      instructions: "Apply when the PR contains WebAssembly-specific changes (WASM interop, web-sys, wasm-bindgen, IndexedDB)"
    - label: "android"
      instructions: "Apply when the PR contains Android/mobile-specific changes (JNI, Kotlin, NDK, Android Activity)"
    - label: "desktop"
      instructions: "Apply when the PR contains desktop-specific changes (cpal, AppImage, native audio, MPRIS)"
    - label: "cashu"
      instructions: "Apply when the PR contains Cashu wallet changes (CDK, mints, proofs, ecash)"
    - label: "security"
      instructions: "Apply when the PR involves cryptography, key management, signature handling, or input sanitization"
    - label: "ui"
      instructions: "Apply when the PR contains Dioxus component, layout, or styling changes"
    - label: "ci-cd"
      instructions: "Apply when the PR modifies GitHub Actions workflows, build scripts, or deployment config"
    - label: "nostr-protocol"
      instructions: "Apply when the PR implements or modifies NIP compliance, event handling, or relay communication"
    - label: "dependencies"
      instructions: "Apply when the PR updates Cargo.toml dependencies, npm packages, or lock files"

  slop_detection:
    enabled: true
    label: "slop"

  path_filters:
    # Build artifacts and dependencies
    - "!**/target/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/Cargo.lock"

    # Android build artifacts
    - "!**/android/app/build/**"
    - "!**/android/.gradle/**"
    - "!**/android/.idea/**"

    # Configuration files that rarely need review
    - "!**/*.md"
    - "!.gitignore"
    - "!LICENSE"
    - "!**/.env*"

    # Generated/bundled files
    - "!**/public/tailwind.css"
    - "!**/public/git-worker.js"
    - "!**/public/sw.js"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        You are reviewing Rust code for a Nostr client built with Dioxus. This project targets **multiple platforms**: WebAssembly (browser), Android (mobile), and desktop.

        You have deep expertise in:
        - **Nostr Protocol**: NIPs, event types, relay communication, and cryptographic signatures
        - **nostr-sdk**: Rust SDK for Nostr protocol implementation
        - **Multi-platform Rust**:
          - **WASM**: Browser-based applications, WASM-bindgen, IndexedDB
          - **Native/Desktop**: tokio runtime, file I/O, native databases
          - **Android/Mobile**: JNI bridge patterns, ndk-context, Android Activity lifecycle
        - **Dioxus Framework**: Component patterns, reactive state management, hooks (use_signal, use_memo, use_effect), routing
        - **Async Rust**: Tokio runtime, async/await patterns, futures, and concurrency primitives
        - **Cashu/Ecash Protocol**: CDK integration, mint/melt operations, quote lifecycle, blind signatures
        - **Dual Storage Architecture**:
          - **WASM**: IndexedDB via `nostr-indexeddb::WebDatabase` + custom `IndexedDbDatabase` for CDK wallet
          - **Native**: `nostr-ndb::NdbDatabase` for events + `cdk-sqlite` for wallet + JSON file storage for settings

        Thoroughly review the code snippets and suggest improvements for these key areas:
          - **Logic**: Flaws in program logic, edge cases, and algorithmic correctness.
          - **Platform-Specific Code**: Check for proper use of `#[cfg(feature = "web")]`, `#[cfg(feature = "native")]`, `#[cfg(feature = "mobile")]`, and `#[cfg(feature = "desktop")]` to handle platform differences correctly. This repo's feature model treats `desktop` and `mobile` as entry features that both imply `native`, so reviewers should treat code guarded by `#[cfg(feature = "desktop")]` or `#[cfg(feature = "mobile")]` as also matching the shared `#[cfg(feature = "native")]` path and should not flag shared native modules that only use `#[cfg(feature = "native")]`. Mobile builds use the native implementation path unless code is truly mobile-specific.
          - **Security**: Vulnerabilities, especially:
            - Nostr event validation and signature verification
            - XSS risks in user-generated content rendering
            - Relay communication and untrusted data handling
            - Cryptographic operations and key management
            - JNI security when communicating with Android signer apps (NIP-55)
          - **Performance**: Bottlenecks, inefficient algorithms, or unnecessary allocations, especially:
            - WASM binary size optimizations (avoid bloat from unused dependencies)
            - Unnecessary clones or allocations (use references where possible in non-component/business-logic code; Dioxus components in this repo intentionally prefer owned props and cheap String clones)
            - Database query efficiency for both IndexedDB (WASM) and nostr-ndb (native)
            - CDK wallet: atomic IndexedDB transactions (WASM) vs SQLite transactions (native)
            - Keyset counter persistence: IndexedDB vs SQLite mechanisms
          - **Concurrency**: Potential data races, deadlocks, improper use of async/await, or channel misuse.
          - **Nostr Protocol Compliance**: Correct implementation of NIPs, event structure, and relay communication patterns.
          - **Cashu Protocol Compliance**:
            - Proper CDK trait implementations (WalletDatabase) for both backends
            - Quote lifecycle management (create → poll → mint/melt → cleanup)
            - Keyset counter atomicity and persistence
            - Blind signature handling
            - Proof management and deletion according to NIP-60
          - **Database Correctness**:
            - **WASM**: IndexedDB atomic transactions, proper quote cleanup
            - **Native**: SQLite transactions via cdk-sqlite, nostr-ndb usage
            - Keyset counter persistence across app restarts
            - Race condition prevention in concurrent operations
          - **Android/Mobile Specific**:
            - JNI bridge safety (android_signer.rs patterns)
            - NIP-55 signer integration via ContentResolver and Intents
            - Android Activity lifecycle handling
            - Thread safety with jni::objects::JObject and classloaders
          - **WASM Best Practices**:
            - Efficient JavaScript interop
            - Memory management (avoiding leaks)
            - Avoiding panics (use proper error handling)
            - Send+Sync safety in single-threaded WASM contexts
          - **Dioxus Patterns**:
            - Proper use of hooks (use_signal for state, use_memo for derived state)
            - Component lifecycle and re-render optimization
            - Event handlers and user interactions
            - Router integration and navigation
          - **Error Handling**:
            - Proper use of Result/Option types
            - Error propagation with ? operator
            - Quote cleanup on failures
            - User-facing error messages (clear and actionable)
            - Logging for debugging
          - **Maintainability & Modularity**:
            - Code that is overly complex, monolithic, or violates separation of concerns
            - Clear module organization
            - Proper separation between UI and business logic
          - **Best Practices**:
            - Adherence to Rust idioms (ownership, lifetimes, zero-cost abstractions)
            - SOLID/KISK principles
            - Proper documentation for complex logic
            - Testing considerations

        Please **do not** comment on:
          - Trivial code style issues or formatting (handled by rustfmt)
          - Missing comments unless they obscure critical logic
          - Naming conventions unless they're misleading

        Focus on identifying and solving significant problems that improve code quality, security, and performance.

    - path: "**/Cargo.toml"
      instructions: |
        Review Rust dependency configurations:
          - Check for outdated or vulnerable dependencies (especially crypto-related crates)
          - Verify feature flags are minimal and necessary (affects WASM binary size)
          - Ensure profile settings (release/dev) are optimal for WASM builds
          - Flag any suspicious or unnecessary dependencies
          - Check for duplicate dependencies with different versions
          - Verify nostr-sdk and CDK versions are compatible
          - **Platform-specific dependencies**:
            - WASM: wasm-bindgen, web-sys, gloo-*, nostr-indexeddb, indexed_db_futures
            - Native: nostr-ndb, cdk-sqlite, dirs, tokio with multi-thread runtime
            - Mobile: jni, ndk-context (must match NDK version)
            - Desktop: arboard, rfd, dioxus/desktop
          - **Feature flag dependencies**:
            - `web`: browser APIs, WASM-specific crates
            - `native`: shared by mobile + desktop (nostr-ndb, cdk-sqlite, git2)
            - `mobile`: JNI bindings for Android
            - `desktop`: desktop-only features
        Only comment on significant issues, not minor version updates.

    - path: "**/*.js"
      instructions: |
        Review JavaScript configuration and interop files:
          - Check for security issues in build configurations
          - Verify WASM loading and initialization patterns
          - Check for proper error handling in JS-Rust interop
          - Verify paths and settings are correct
          - Flag any unnecessary complexity or performance issues
        Keep comments minimal and focus on actual issues.

    - path: "**/index.html"
      instructions: |
        Review HTML entry point for WASM application:
          - Security: CSP headers, script integrity, XSS prevention
          - Performance: Resource loading strategy, critical CSS, WASM loading
          - Accessibility: Semantic HTML, ARIA attributes
          - SEO: Meta tags, Open Graph, Nostr NIP-05 metadata
          - PWA considerations: manifest, service worker

    - path: "**/*.css"
      instructions: |
        Review CSS and Tailwind styles:
          - Check for performance issues (overly specific selectors, excessive animations)
          - Verify responsive design patterns
          - Check for accessibility issues (color contrast, focus styles)
          - Flag unused or redundant styles

    - path: "**/android/**/*.kt"
      instructions: |
        Review Kotlin/Android code for the native Android signer integration (NIP-55):
          - **NIP-55 Signer Implementation**:
            - ContentResolver queries for get_public_key, sign_event, nip04/nip44 encrypt/decrypt
            - Intent-based approval flows for first-time signer connections
            - Proper handling of signer permissions (pre-authorized event kinds)
          - **Android Lifecycle**:
            - Activity creation and destruction (onCreate, onDestroy)
            - Activity instance management and thread safety
            - Proper synchronization for pending results
          - **Thread Safety**:
            - Volatile variables for mutable state shared across threads
            - Synchronized blocks for Intent state management
            - Thread-safe polling pattern for signer results
          - **Security**:
            - Package name validation for signer apps
            - Error handling for ContentResolver queries
            - Protection against malicious signer apps
          - **Error Handling**:
            - Graceful handling of signer rejections
            - Proper null checks for cursor operations
            - Logging for debugging signer interactions
          - **Package Manager**:
            - Querying for installed signer apps via Intent resolution
            - Proper handling when no signers are installed
          - **Code Quality**:
            - Clean separation between MainActivity and signer logic
            - Proper resource cleanup
            - Clear documentation of NIP-55 protocol interactions

    - path: "**/.github/workflows/*.yml"
      instructions: |
        Review GitHub Actions CI/CD workflows:
          - **Security**: Pin actions to SHA commits instead of tags where feasible, avoid secret exposure
          - **Correctness**: Verify action versions are current, proper use of matrix strategies
          - **Caching**: Check cargo and gradle cache configurations for efficiency
          - **Build matrix**: Verify WASM, native (desktop), and Android builds are all covered
          - **Dependencies**: Check that build dependencies (clang, cmake, libasound2-dev, libglib2.0-dev, libgtk-3-dev, libwebkit2gtk-4.1-dev, etc.) match AGENTS.md
          - **Deployment**: Verify release artifact naming, signing, and changelog generation
        Only flag significant issues.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false
    custom:
      - name: "check feature flags"
        enabled: true
        instructions: |
          Review all changed Rust files for correct use of #[cfg(feature = "...")] gates.
          Verify that:
          - Platform-specific code uses the correct feature: "web" for WASM, "native" for shared native, "desktop" for desktop-only, "mobile_platform" for Android-specific
          - No code is accidentally excluded from a platform by missing a feature gate
          - Dependencies gated behind features are actually used when that feature is enabled
          - The "native" feature is correctly shared between "desktop" and "mobile" entry features
          Flag any inconsistencies or potential build breakage across platforms.
      - name: "review wasm compatibility"
        enabled: true
        instructions: |
          Review all changed Rust files for WASM compatibility issues:
          - No blocking I/O (std::fs, std::net, std::thread::spawn without spawn_local)
          - No use of crates that don't compile to wasm32-unknown-unknown
          - Proper use of wasm-bindgen-futures::spawn_local instead of tokio::spawn
          - JavaScript interop uses correct wasm_bindgen attributes
          - Send+Sync bounds are not required in WASM-only code paths
          - Memory management: no leaks in JS-Rust boundary code
          Suggest fixes for any issues found.
      - name: "security audit"
        enabled: true
        instructions: |
          Perform a focused security review of all changed files:
          - Cryptographic operations: key handling, signature verification, random number generation
          - Input validation: user-generated content, relay responses, untrusted JSON
          - XSS vectors: HTML rendering of notes/articles, markdown parsing, URL handling
          - Financial security: Cashu proof handling, Lightning invoice validation, amount checks
          - Key management: secret key storage, NIP-07/46/49/55 signer security
          - Android: JNI boundary security, ContentResolver query safety, signer app validation
          Report findings with severity (critical/high/medium/low) and suggested fixes.
      - name: "update changelog"
        enabled: true
        instructions: |
          Based on the changes in this PR, generate a changelog entry following the project's existing format in public/docs/changelogs/.
          The entry should:
          - Use the version from Cargo.toml
          - Categorize changes as: Features, Bug Fixes, Improvements, or Breaking Changes
          - Include brief descriptions of each change
          - Reference any relevant NIP numbers or protocol changes
          Only output the suggested changelog content, do not modify files directly.

  pre_merge_checks:
    title:
      mode: warning
      requirements: "Title should follow conventional commits format (e.g., 'feat:', 'fix:', 'chore:', 'refactor:', 'docs:', 'style:', 'test:', 'ci:')"
    description:
      mode: warning
    issue_assessment:
      mode: warning
    docstrings:
      mode: off

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    drafts: false

    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
      - "POC"
      - "EXPERIMENT"
      - "[skip review]"

    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

    labels:
      - "!skip-review"

    base_branches:
      - "main"
      - "master"
      - "develop"
      - "^feature/.*"
      - "^up/.*"
      - "^release/.*"
      - "^hotfix/.*"

  tools:
    clippy:
      enabled: true

    yamllint:
      enabled: true

    markdownlint:
      enabled: true

    gitleaks:
      enabled: true

    trufflehog:
      enabled: true

    shellcheck:
      enabled: true

    actionlint:
      enabled: true

    zizmor:
      enabled: true

    detekt:
      enabled: true

    osvScanner:
      enabled: true

    github-checks:
      enabled: true
      timeout_ms: 90000

    languagetool:
      enabled: false

    biome:
      enabled: false

    eslint:
      enabled: false

    stylelint:
      enabled: false

chat:
  auto_reply: true
  art: true

code_generation:
  docstrings:
    path_instructions:
      - path: "**/*.rs"
        instructions: |
          Generate rustdoc-style doc comments using /// for items and //! for modules.
          Include # Arguments, # Returns, # Errors, # Panics, and # Safety sections where applicable.
          Use markdown formatting with backticks for code references.
          Keep docstrings concise but informative — avoid restating what the type signature already shows.
  unit_tests:
    path_instructions:
      - path: "**/*.rs"
        instructions: |
          Generate #[cfg(test)] inline test modules following the project's existing pattern.
          Use assert!, assert_eq!, assert_ne! from the standard library.
          Test both happy paths and edge cases (empty inputs, None values, overflow).
          For async functions, use tokio::test attribute on native, wasm_bindgen_test on web.
          Do not introduce external test dependencies not already in Cargo.toml.

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: false
      labels:
        - "needs-plan"
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: "bug"
        instructions: "Something isn't working or produces incorrect behavior"
      - label: "enhancement"
        instructions: "New feature or improvement to existing functionality"
      - label: "rust"
        instructions: "Issue involves Rust source code changes"
      - label: "wasm"
        instructions: "Issue is specific to WebAssembly/browser platform"
      - label: "android"
        instructions: "Issue is specific to Android/mobile platform"
      - label: "desktop"
        instructions: "Issue is specific to desktop platform"
      - label: "security"
        instructions: "Issue relates to security, cryptography, or key management"
      - label: "nostr-protocol"
        instructions: "Issue involves NIP implementation or Nostr protocol compliance"
      - label: "cashu"
        instructions: "Issue involves Cashu wallet, ecash, or Lightning payments"
      - label: "ui"
        instructions: "Issue involves UI components, layout, or styling"

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
