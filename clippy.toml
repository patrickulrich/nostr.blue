# DRY guardrails — see plan: ~/.opencode/plan/nostr-sdk-dry-facade.md
#
# Ratchet: uncomment an entry only when no violations remain outside the
# allowlisted wrapper modules (stores/nostr_client, stores/relay,
# stores/publish_queue, hooks/use_relay_subscription, tests/sdk45_semantics).
# CI runs `clippy -D warnings` on all four feature targets, so activation is
# enforced the moment it lands.
#
# Activation checklist:
#   [x] fetch_events   — ACTIVATED: every inline site now goes through
#                        nostr_client::fetch / fetch_with_client /
#                        fetch_event_by_id
#   [ ] subscribe      — after sites move to subscription_manager / hook
#   [ ] stream_events  — after progressive paths use nostr_client::streaming
#   [ ] notifications  — after remaining hand-rolled loops move to the
#                        dispatcher / spawn_subscription
#   [ ] send_event     — only nip65 + ephemeral factory allowed outside queue

disallowed-methods = [
  { path = "nostr_sdk::client::Client::fetch_events", reason = "use nostr_client::fetch / fetch_with_client / fetch_event_by_id (raw access allowed only in stores/nostr_client, stores/relay, sdk45 tests)" },
  # Activate as remaining sites migrate:
  # { path = "nostr_sdk::client::Client::subscribe", reason = "use subscription_manager / use_relay_subscription" },
  # { path = "nostr_sdk::client::Client::stream_events", reason = "use nostr_client::streaming" },
  # { path = "nostr_sdk::client::Client::notifications", reason = "use notification_dispatcher / spawn_subscription" },
  # { path = "nostr_sdk::client::Client::send_event", reason = "use publish_queue (exceptions: nip65, ephemeral)" },
]
